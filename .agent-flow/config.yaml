version: 1
token_profile: budget
inline_level: full
phases:
  skip_research: auto
  skip_reassessment: auto
models:
  discovery_light:
    model: anthropic/claude-sonnet-4-6
    fallbacks: []
  discovery_deep:
    model: anthropic/claude-opus-4-7
    fallbacks:
      - anthropic/claude-sonnet-4-6
  topic_classifier:
    model: anthropic/claude-haiku-4-5-20251001
    fallbacks: []
  specifier:
    model: anthropic/claude-sonnet-4-6
    fallbacks: []
  planner:
    model: anthropic/claude-opus-4-7
    fallbacks: []
  worker:
    model: anthropic/claude-sonnet-4-6
    fallbacks: []
  worker_simple:
    model: anthropic/claude-haiku-4-5-20251001
    fallbacks: []
  self_review:
    model: anthropic/claude-sonnet-4-6
    fallbacks: []
  classifier:
    model: anthropic/claude-haiku-4-5-20251001
    fallbacks: []
auth:
  llm:
    primary_provider: anthropic
    fallback_providers:
      - openrouter
  git:
    preferred_host: github
    default_repo: smbss1/flow-mvp-test
connections:
  llm:
    anthropic:
      enabled: true
      auth_method: api-key
      secret_scope: project
      last_tested_at: 2026-05-08T17:03:40.431Z
      access_status: verified
    openrouter:
      enabled: true
      last_tested_at: 2026-05-08T17:03:35.609Z
      access_status: auth_failed
  git:
    github:
      enabled: true
      secret_scope: project
      last_tested_at: 2026-05-08T17:01:58.633Z
      scopes_ok: true
tracker:
  type: github
  repo: smbss1/flow-mvp-test
  labels:
    blocked: flow:blocked
    ready: flow:ready
    in_progress: flow:in-progress
    in_review: flow:in-review
    request_changes: flow:request-changes
git:
  host: github
  base_branch: main
  branch_prefix: flow/
  isolation: worktree
workers:
  max_parallel: 1
  sandbox: docker
  network:
    mode: whitelist
    allow_git_hosts: true
    allow_llm_apis: true
    allow_package_managers: false
    extra_domains: []
  scope:
    deny_paths:
      - .pi/**
      - .agent-flow/sessions/**
      - "*.jsonl"
    allow_companions: []
  timeout_minutes: 30
  bash_optimization: rtk
verification_commands: []
verification_auto_fix: true
verification_max_retries: 2
discovery:
  default_mode: light
  light:
    max_rounds: 15
    repo_exploration: true
    repo_files_max: 5
  deep:
    max_rounds: 40
    repo_exploration: true
    repo_files_max: 15
    require_all_angles_covered: true
  past_decisions_lookback_days: 90
  glossary_skill: true
  budget_token_ceiling: null
dispatcher:
  tick_seconds: 30
  stuck_detection:
    window_size: 10
    threshold: 0.7
context_selection:
  enabled: true
  threshold_kb: 3
  max_chars: 8000
token_budgets:
  discover_grilling_input: 6000
  discover_synthesizer_input: 12000
  self_review_input: 8000
  feedback_input: 9000
  planner_input: 10000
compaction:
  discovery:
    enabled: true
    keep_recent_rounds: 2
    compact_every_rounds: 3
    max_history_tokens_before_compact: 3000
artifact_reducers:
  diff: true
  tests: true
  lint: true
  json_logs: true
codemap:
  enabled: true
  exclude: []
  max_file_size_kb: 200
  max_files: 10000
  language_overrides: {}
  lazy_grammar_download: true
  grammars: {}
  summaries:
    enabled: true
    max_input_chars: 8000
    concurrency: 5
  digest:
    default_budget_tokens: 5000
    max_symbols_per_file: 4
auto_html_report: true
budget_ceiling_usd: null
